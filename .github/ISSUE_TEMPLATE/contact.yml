name: Contact the team
description: Ask a question, give feedback or request help. This is the contact form for this project.
title: "[Contact] "
labels: ["contact"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to contact the Data Management Team about this project. It is a public GitHub issue, so **do not include personal data, security details or anything marked OFFICIAL-SENSITIVE or above**.

        To report a security problem, use [private vulnerability reporting](https://github.com/cyberdudeuk/ndl-pubsec-mcp/security/advisories/new) instead.

        If you cannot use this form, say so in the box below with only a way for us to reach you that you are happy to make public, or ask a colleague to raise it for you.
  - type: dropdown
    id: about
    attributes:
      label: What is it about?
      options:
        - A question about using the MCP server
        - Feedback on a tool's results
        - xGov MEM validation (metadata standard)
        - A dataset or catalogue issue
        - Something else
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Your message
      description: Plain words are fine. Include the tool name and what you asked it, if relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included personal data or anything sensitive. I understand this issue is public.
          required: true
