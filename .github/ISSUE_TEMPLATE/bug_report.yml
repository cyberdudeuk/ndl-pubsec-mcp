name: Bug report
description: A tool returned something wrong, or the server failed
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options: [catalogue_search, dataset_describe, metadata_validate, standard_explain, Server start-up or other]
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: What you sent
      description: The tool arguments. Remove anything sensitive.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0"
