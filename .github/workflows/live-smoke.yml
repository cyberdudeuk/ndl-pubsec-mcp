name: Live smoke test

# Checks the real data.gov.uk API still behaves as the server expects (open item O-01).
# Weekly and on demand, not on pull requests, so an outage elsewhere never blocks a merge.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/live-smoke.mjs
