# Accepted exceptions to the repository standards. Each needs a rationale, a review date and a reference.
# The compliance checker treats an item as an EXCEPTION (not a PASS) only when all three are present.
exceptions:
  - check: SC-04
    item: "security contact email"
    rationale: "Owner decision (3 November 2026): no email address is published on any artefact; contact is by form only. Security reports go privately through GitHub private vulnerability reporting (switched on), as SECURITY.md explains. This departs from the GDS Way rule to give an email address for security reports."
    reviewed: 2026-11-27
    reference: SECURITY.md
  - check: SC-03
    item: "CC-BY-4.0 content licence"
    rationale: "Owner decision (licensing rule, 19 November 2026): code is MIT; documentation and content are CC BY 4.0 rather than OGL, because the content is not GOV.UK or Crown copyright material. Crown copyright material quoted keeps its Open Government Licence. The OGL v3.0 states that complying with CC BY 4.0 satisfies its conditions. Departs from the GDS Way rule to include an OGL licence file."
    reviewed: 2026-11-27
    reference: README.md
